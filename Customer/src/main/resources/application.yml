server:
  port: 8080
spring:
  output:
    ansi:
      enabled: always
  application:
    name: customer
  datasource:
    password: billy
    url: jdbc:postgresql://localhost:5432/customer
    username: billy
  jpa:
    hibernate:
      ddl-auto: 'create-drop'
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
