server:
  port: 8083

spring:
  output:
    ansi:
      enabled: always
  application:
    name: api-gateway

  zipkin:
    base-url: http://localhost:9411

  cloud:
    gateway:
      routes:
        - id: customer
          uri: lb://CUSTOMER
          predicates:
            - Path=/customers/**
        - id: fraud
          uri: lb://FRAUD
          predicates:
            - Path=/fraud/**
        - id: notification
          uri: lb://NOTIFICATION
          predicates:
            - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
